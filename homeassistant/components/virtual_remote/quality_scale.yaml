rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration does not provide custom actions. It uses existing
      remote entity services such as remote.send_command.

  appropriate-polling:
    status: exempt
    comment: |
      Virtual remote entities do not poll external devices. Availability is
      derived from the linked infrared entity state.

  brands:
    status: exempt
    comment: |
      This device-style integration currently does not require dedicated branding assets.

  common-modules:
    status: done
    comment: |
      The integration uses the standard Home Assistant integration file layout.

  config-flow:
    status: done
    comment: |
      The integration supports full UI configuration flows.

  config-flow-test-coverage:
    status: done
    comment: |
      Config flow tests cover successful setup, no available infrared entities,
      invalid infrared entity selection, duplicate remote handling, and
      reconfiguration.

  dependency-transparency:
    status: exempt
    comment: |
      The integration declares a dependency on the infrared integration. The shared infrared_protocols package is owned by the infrared integration.

  docs-actions:
    status: exempt
    comment: |
      This integration does not provide custom actions. Users call the standard
      remote.send_command service.

  docs-high-level-description:
    status: done
    comment: |
      Documentation describes Virtual Remote as a user-defined infrared-controlled
      device backed by an existing infrared entity.

  docs-installation-instructions:
    status: done
    comment: |
      Documentation explains that users add Virtual Remote from the UI and select
      the infrared entity that transmits commands.

  docs-removal-instructions:
    status: done
    comment: |
      Documentation explains that removing the config entry removes the virtual
      remote device and its entities.

  entity-event-setup:
    status: done
    comment: |
      Entity event listeners are registered from async_added_to_hass and removed
      through async_on_remove.

  entity-unique-id:
    status: done
    comment: |
      Each virtual remote entity has a stable unique ID derived from the config
      entry and virtual remote ID.

  has-entity-name:
    status: done
    comment: |
      Virtual remote entities set has_entity_name so entity names follow Home
      Assistant naming conventions.

  runtime-data:
    status: exempt
    comment: |
      This integration does not create or maintain a runtime API client
      or coordinator that needs to be stored in entry.runtime_data.

  test-before-configure:
    status: done
    comment: |
      The config flow validates that at least one infrared entity exists and
      rejects unavailable infrared entity selections before creating an entry.

  test-before-setup:
    status: exempt
    comment: |
      This integration has no external API connection to validate before
      setup. Linked infrared entity availability is represented by entity
      availability and repair issues at runtime.

  unique-config-entry:
    status: done
    comment: |
      Each virtual remote config entry gets a stable unique ID derived from the
      normalized remote name, and duplicate remote names are rejected.

  # Silver
  action-exceptions:
    status: todo
    comment: |
      Review all user-facing service exceptions and add dedicated translation
      keys where needed.

  config-entry-unloading:
    status: done
    comment: |
      The integration unloads forwarded remote, button, and media_player platforms
      on config entry unload.

  diagnostics:
    status: done
    comment: |
      The integration provides diagnostics with sensitive and large command
      payload data redacted.

  docs-configuration-parameters:
    status: todo
    comment: |
      Expand documentation for all options-flow configuration parameters.

  docs-installation-parameters:
    status: todo
    comment: |
      Expand documentation for all config-flow fields.

  entity-unavailable:
    status: done
    comment: |
      Virtual remote entities become unavailable when their linked infrared
      entity is unavailable or missing.

  integration-owner:
    status: done
    comment: |
      The manifest declares a code owner for the integration.

  log-when-unavailable:
    status: exempt
    comment: |
      The virtual remote does not maintain its own connection. Availability
      follows the linked infrared entity and repair issues guide the user.

  parallel-updates:
    status: done
    comment: |
      Entity platforms set PARALLEL_UPDATES appropriately for service-style
      entities backed by an existing infrared entity.

  reauthentication-flow:
    status: exempt
    comment: |
      This integration has no authentication.

  repair-issues:
    status: done
    comment: |
      The integration creates and clears repair issues when a configured virtual
      remote references a missing or unavailable infrared entity.

  stale-devices:
    status: done
    comment: |
      The remote platform cleans up stale remote entity and device registry entries.
      The button platform cleans up stale button entities for commands no longer
      exposed as buttons, and the media_player platform cleans up stale TV media
      player entities when a remote is no longer configured as a TV.

  strict-typing:
    status: todo
    comment: |
      Strict typing can be enabled after the integration is added to
      .strict-typing and the remaining typed ConfigEntry work is completed.

  test-coverage:
    status: done
    comment: >
      Unit tests cover runtime paths, config flows, options flows,
      diagnostics, repairs, and remote entity behavior.

  # Gold
  devices:
    status: done
    comment: |
      Each configured virtual remote is represented as its own device.

  discovery:
    status: exempt
    comment: |
      Virtual Remote devices are user-defined and backed by existing infrared
      entities, so there is no physical device or network service to discover.

  discovery-update-info:
    status: exempt
    comment: |
      This integration has no discovery information to update.

  docs-data-update:
    status: exempt
    comment: |
      The integration does not fetch external data. It forwards commands to a
      linked infrared entity.

  docs-examples:
    status: todo
    comment: |
      Add complete automation examples, command sequence examples, repeat and
      delay examples, and raw command usage examples.

  docs-known-limitations:
    status: todo
    comment: |
      Add documentation for limitations such as assumed-state IR sending, lack
      of infrared learning, and dependence on the linked infrared entity.

  docs-supported-devices:
    status: exempt
    comment: |
      This integration creates user-defined infrared-controlled devices backed
      by Home Assistant infrared entities.

  docs-supported-functions:
    status: todo
    comment: |
      Expand documentation for supported remote, button, and TV media_player
      behavior.

  docs-troubleshooting:
    status: todo
    comment: |
      Add troubleshooting guidance for unavailable infrared entities, invalid
      commands, and configuration issues.

  docs-use-cases:
    status: todo
    comment: |
      Add documentation for automation, scripting, reusable command, and raw
      infrared transmission use cases.

  dynamic-devices:
    status: done
    comment: |
      Devices are user-managed through config and options flows and stale
      devices are cleaned up when removed.

  entity-category:
    status: exempt
    comment: |
      This integration provides primary user-facing remote, media_player, and
      command button entities.

  entity-device-class:
    status: exempt
    comment: |
      The media_player platform uses the TV device class for TV remotes. The
      remote and button platforms do not use device classes for these entities.

  entity-disabled-by-default:
    status: exempt
    comment: |
      The configured virtual remote, TV media_player, and explicitly enabled
      command buttons are primary user-facing entities and should be enabled by
      default.

  entity-translations:
    status: exempt
    comment: |
      Remote and media_player entities use the configured device name. Command
      button names are generated from user-defined command names.

  exception-translations:
    status: todo
    comment: |
      Add dedicated translation keys for all service-parameter validation
      messages before claiming this rule.

  icon-translations:
    status: exempt
    comment: |
      The integration uses dynamic icons for command buttons based on command
      names rather than static icon translations. The TV media_player uses the
      platform device class icon behavior.

  reconfiguration-flow:
    status: done
    comment: |
      The integration implements a reconfiguration flow for the first configured
      virtual remote.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      This integration depends on the Home Assistant infrared integration and has
      no direct external runtime client dependency.

  inject-websession:
    status: exempt
    comment: |
      This integration does not create an HTTP client session.
